# This file provides an explicit and complete build environment for NocoDB.

[phases.setup]
# CRITICAL FIX: We are removing "..." to PREVENT Nixpacks from auto-detecting
# and adding its own default packages. This configuration REPLACES the defaults.
# We are explicitly defining ONLY Node.js v20 and pnpm v8.
nixPkgs = ["nodejs_20", "pnpm_8"]

[phases.install]
# Use pnpm to install dependencies from the monorepo root.
cmds = ["pnpm install"]

[phases.build]
# Build only the 'nocodb' package.
cmds = ["pnpm run build --filter nocodb"]

[start]
# Start only the 'nocodb' package.
cmd = "pnpm --filter nocodb start"
